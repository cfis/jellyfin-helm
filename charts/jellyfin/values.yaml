# Default values for jellyfin
nameOverride: ""
fullnameOverride: ""

image:
  registry: docker.io
  account: jellyfin
  name: jellyfin
  #tag: # Defaults .Chart.AppVersion 
  pullPolicy: IfNotPresent
  imagePullSecrets: []

# -- Additional annotations to apply to the pod.
podAnnotations: {}

# -- Additional labels to be added to pods.
podLabels: {}

# -- Number of pods. (_**It's not recommended to add more instance of jellyfin**_)
#    NOTE: replicaCount are "disabled" because Jellyfin currently not handle HA
# replicaCount: 1

# -- StatefulSet update strategy. Maps directly to `spec.updateStrategy`. Valid types are
#    `RollingUpdate` (default) and `OnDelete`. Note: a StatefulSet does not support the
#    Deployment-style `Recreate` type or `maxSurge`.
#    (https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#update-strategies)
strategy: {}
# example:
#   strategy:
#     type: RollingUpdate
#     rollingUpdate:
#       maxUnavailable: 1

# -- Node labels for pod assignment
nodeSelector:
  kubernetes.io/os: linux

# expects input structure as per specification
# -- Affinity for pod assignment (https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.26/#affinity-v1-core)
affinity: {}
# example:
#   affinity:
#     nodeAffinity:
#      requiredDuringSchedulingIgnoredDuringExecution:
#        nodeSelectorTerms:
#        - matchExpressions:
#          - key: foo.bar.com/role
#            operator: In
#            values:
#            - master

# -- Tolerations for pod assignment (https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.26/#toleration-v1-core)
tolerations: []
# example:
#   tolerations:
#   - key: foo.bar.com/role
#     operator: Equal
#     value: master
#     effect: NoSchedule

# -- Topology Spread Constraints for pod assignment
#    (https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#topologyspreadconstraint-v1-core)
topologySpreadConstraints: []
# example:
#   topologySpreadConstraints:
#   - maxSkew: 2
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: ScheduleAnyway
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/instance: jellyfin
#         app.kubernetes.io/component: dashboard

resources:
  jellyfin:
    # -- The requested resources for the container
    requests:
      cpu: 500m
      memory: 512Mi
    # -- The resources limits for the container
    limits:
      cpu: '2'
      memory: 6Gi

# -- Security context for the pod (https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)
podSecurityContext:
  runAsGroup: 64710
  runAsNonRoot: true
  runAsUser: 64710
  fsGroup: 64710
  seccompProfile:
    type: RuntimeDefault

# -- Security context for the jellyfin container
#    (https://kubernetes.io/docs/tasks/configure-pod-container/security-context/)
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 64710
  runAsNonRoot: true
  runAsUser: 64710

# tmpfs mounted at `/tmp`. The root filesystem is read-only, so this is the only
# writable scratch space outside the PVCs.
tmpfs:
  # -- Size limit for the in-memory `/tmp` volume. Increase if transcoding or other
  #    operations spill temporary files into `/tmp`.
  sizeLimit: 10Mi

# -- Persistent volumes mounted into the pod. Each key becomes a `volumeClaimTemplates`
#    PVC mounted at `/<key>`. Persistence is always enabled; config and cache are stateful.
persistence:
  config:
    # -- PVC settings (see
    #    https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.26/#persistentvolumeclaim-v1-core
    #    for structural reference)
    storageClassName:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 250Mi
  cache:
    # -- PVC settings (see
    #    https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.26/#persistentvolumeclaim-v1-core
    #    for structural reference)
    storageClassName:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi

# -- The list of volumes that will be mounted inside jellyfin pod, to `/media`.
mediaVolumes: {}
# This volume will be mounted into `/media/movies`
# movies:
#   storageClassName:
#   accessModes:
#     - ReadWriteOnce
#   resources:
#     requests:
#       storage: 1Ti

serviceAccount:
  create: false
  annotations: {}
  # -- Jellyfin never calls the Kubernetes API, so don't mount its token.
  automount: false

service:
  webport: 80
  dlnaport: 1900 
 
ingress:
  # -- Enable ingress resource
  enabled: false
  # -- IngressClass that will be used to implement the Ingress
  className: ""
  # -- Additional annotations for the Ingress resource. To enable certificate autogeneration, place here your cert-manager annotations.
  annotations: {}
  host: jellyfin.local
  # -- The Path to jellyfin. You may need to set this to '/*' in order to use this with ALB ingress controllers.
  path: /
  # -- Ingress path type
  pathType: Prefix

  # -- Enable TLS for `host`. When true, `tlsSecret` names the Secret holding the certificate
  #    (leave the default and use cert-manager annotations to have it created automatically).
  tls: false
  # -- Name of the TLS Secret for `host`. Defaults to `<fullname>-tls` when empty.
  tlsSecret: ""

networkPolicy:
  # -- Enable the default NetworkPolicy policy
  enabled: false
  # -- Don't require client label for connections
  allowExternal: true
  # -- Whether to allow all outbound traffic by default.
  allowAllOutbound: true
  # -- Sets ingress policy block. See NetworkPolicies documentation (https://kubernetes.io/docs/concepts/services-networking/network-policies/).
  ingress: []
  # -- Sets egress policy block. See NetworkPolicies documentation (https://kubernetes.io/docs/concepts/services-networking/network-policies/).
  egress: []