apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "jellyfin.fullname" . }}-test-connection"
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.37.0
      command: ['wget']
      args: ['{{ include "jellyfin.fullname" . }}:8096/web']
      resources:
        limits:
          cpu: 50m
          memory: 32Mi
        requests:
          cpu: 10m
          memory: 16Mi
  restartPolicy: Never
