{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "jellyfin.fullname" . }}
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "jellyfin.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound traffic to the Jellyfin ports.
    - ports:
        - port: 8096
          protocol: TCP
        - port: 1900
          protocol: UDP
      {{- if not .Values.networkPolicy.allowExternal }}
      # Restrict to pods explicitly labelled as clients.
      from:
        - podSelector:
            matchLabels:
              {{ include "jellyfin.fullname" . }}-client: "true"
      {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowAllOutbound }}
    # Allow all outbound traffic.
    - {}
    {{- else }}
    # Always allow DNS resolution.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
{{- end }}
